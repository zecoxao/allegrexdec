[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "allegrexdec"
version = "0.1.0"
description = "Decompiler for the Sony PSP Allegrex CPU (MIPS II + FPU + VFPU)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "zecoxao" }]
keywords = ["allegrex", "psp", "mips", "vfpu", "sony", "decompiler", "ida", "reverse-engineering"]

[project.urls]
Homepage = "https://github.com/zecoxao/allegrexdec"

[project.scripts]
allegrexdec = "allegrexdec.cli:main"

[tool.setuptools]
packages = ["allegrexdec"]
py-modules = ["allegrexdec_plugin"]
